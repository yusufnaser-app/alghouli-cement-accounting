plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // يجب تطبيق إضافة Flutter Gradle بعد إضافتي Android وKotlin مباشرة
    id "dev.flutter.flutter-gradle-plugin"
}

// تحميل إعدادات التوقيع بعد plugins {}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseSigning = keystorePropertiesFile.exists()

if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.alghouli.cement"

    // تم رفعه من 35 إلى 36 لأن Plugins و AndroidX الحالية
    // تتطلب compileSdk 36 أو أعلى.
    compileSdk 36

    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // لا تغيّر applicationId بعد النشر على Google Play
        applicationId "com.alghouli.cement"

        minSdk 23

        // يمكن إبقاؤه 35؛ المطلوب لحل الخطأ الحالي هو compileSdk 36
        targetSdk 35

        versionCode 3
        versionName "3.0.0"

        multiDexEnabled true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ?
                        file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // إذا لم يوجد key.properties يستخدم debug signing
            // للتجارب فقط، وليس للنشر على Play Store.
            signingConfig hasReleaseSigning ?
                    signingConfigs.release : signingConfigs.debug

            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    constraints {
        // مكان مخصص لأي قيود إصدارات مستقبلية
    }
}
